name: gallery
description: The Looseleaf UI gallery. Every component and block with its examples.
version: 0.1.0
publish_to: "none"
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  looseleaf_ink:
    path: ../../packages/looseleaf_ink
  looseleaf_ui:
    path: ../../packages/looseleaf_ui
  provider: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0

flutter:
  assets:
    - lib/features/components/examples/asterisk/
    - lib/features/components/examples/badge/
    - lib/features/components/examples/boil/
    - lib/features/components/examples/button/
    - lib/features/components/examples/chart/
    - lib/features/components/examples/doodle/
    - lib/features/components/examples/kbd/
    - lib/features/components/examples/label/
    - lib/features/components/examples/label_tag/
    - lib/features/components/examples/mascot/
    - lib/features/components/examples/separator/
    - lib/features/components/examples/sidebar/
    - lib/features/components/examples/squiggle/
    - lib/features/components/examples/sticker_sheet/
    - lib/features/components/examples/strike/
    - lib/features/components/examples/switch/
    - lib/features/components/examples/toggle/
    - lib/features/components/examples/typing_indicator/
