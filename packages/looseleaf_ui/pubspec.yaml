name: looseleaf_ui
description: Hand-drawn Flutter widgets on paper, ported from Looseleaf.
version: 0.1.0
publish_to: "none"
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  looseleaf_ink:
    path: ../looseleaf_ink

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0

flutter:
  fonts:
    - family: KevinSans
      fonts:
        - asset: assets/fonts/KevinSans-Regular.ttf
        - asset: assets/fonts/KevinSans-Bold.ttf
          weight: 700
